# ------------------------------------------------------------------------------
# Zensical — the documentation site of fastsandbox.
#
# The pages are the Markdown files of `docs/`; their code comes from the
# snippets of `docs_src/`, included as they are tested by `tests/test_docs_src/`
# (`--8<-- "docs_src/…"`), and the API reference is rendered from the
# docstrings of the package and the stubs of the extension (`::: fastsandbox.X`).
# `just docs` previews the site, `just docs-build` builds it in strict mode, as
# the `Docs` job of the CI does; `.github/workflows/docs.yml` publishes it to
# GitHub Pages. Reference: https://zensical.org/docs/setup/basics/
# ------------------------------------------------------------------------------

[project]
site_name = "fastsandbox"
site_url = "https://aartintelligent.github.io/fastsandbox/"
site_description = "Run code and coding agents in throw-away Docker Sandboxes, from Python."
repo_url = "https://github.com/aartintelligent/fastsandbox"
repo_name = "aartintelligent/fastsandbox"
edit_uri = "edit/main/docs/"
copyright = """
Copyright &copy; Aurelien Andre. MIT OR Apache-2.0. fastsandbox is an \
independent project and is not affiliated with or endorsed by Docker, Inc."""
docs_dir = "docs"
site_dir = "site"
# Snippets and docstrings live outside `docs/`: a change rebuilds the preview.
watch = ["SECURITY.md", "docs_src", "fastsandbox"]
# One tab per question a reader asks, one directory of `docs/` per section:
# Overview (should I use it?), Documentation (how do I use it?), Reference
# (what does this name do?), Project (who makes it, how do I take part?).
# Every entry is named: a section is a label, never a page of its own.
nav = [
    { "Home" = "index.md" },
    { "Overview" = [
        { "Why" = "overview/why.md" },
        { "Features" = "overview/features.md" },
        { "Use cases" = "overview/use-cases.md" },
        { "Design" = "overview/design.md" },
        { "Compatibility" = "overview/compatibility.md" },
    ] },
    { "Documentation" = [
        { "Get started" = [
            { "Quickstart" = "get-started/quickstart.md" },
            { "Installation" = "get-started/installation.md" },
            { "With Claude Code" = "get-started/claude-code.md" },
            { "First steps" = "get-started/first-steps.md" },
        ] },
        { "Agent sandboxes" = [
            { "Give it a repository" = "agents/repository.md" },
            { "Control its network" = "agents/network.md" },
            { "Follow its work" = "agents/follow.md" },
            { "Give it tools" = "agents/tools.md" },
            { "Run several agents" = "agents/several.md" },
        ] },
        { "FastSandbox" = [
            { "Introduction" = "framework/index.md" },
            { "Tasks" = "framework/tasks.md" },
            { "Inputs and outputs" = "framework/inputs-outputs.md" },
            { "Agents" = "framework/agents.md" },
            { "Host paths" = "framework/host-paths.md" },
            { "Network rules" = "framework/network.md" },
            { "Dependencies" = "framework/dependencies.md" },
            { "Lifespan and state" = "framework/lifespan.md" },
            { "Running tasks" = "framework/running.md" },
            { "Command line" = "framework/cli.md" },
        ] },
        { "Client" = [
            { "Introduction" = "client/index.md" },
            { "Sandboxes" = "client/sandboxes.md" },
            { "Commands" = "client/commands.md" },
            { "Files" = "client/files.md" },
            { "Interactive sessions" = "client/interactive.md" },
            { "Network and policy" = "client/network.md" },
            { "Ports" = "client/ports.md" },
            { "Credentials" = "client/credentials.md" },
            { "Images" = "client/images.md" },
            { "Events and prompts" = "client/events.md" },
            { "SSH" = "client/ssh.md" },
            { "MCP gateway" = "client/mcp.md" },
            { "The daemon" = "client/daemon.md" },
            { "Kits" = "client/kits.md" },
            { "Errors" = "client/errors.md" },
        ] },
        { "Guides" = [
            { "Testing" = "guides/testing.md" },
            { "Security" = "guides/security.md" },
            { "Troubleshooting" = "guides/troubleshooting.md" },
            { "Examples" = "guides/examples.md" },
        ] },
    ] },
    { "Reference" = [
        { "Introduction" = "reference/index.md" },
        { "Client" = "reference/client.md" },
        { "Sandboxes" = "reference/sandboxes.md" },
        { "Sessions and streams" = "reference/sessions.md" },
        { "Daemon services" = "reference/services.md" },
        { "Kits" = "reference/kits.md" },
        { "FastSandbox" = "reference/applications.md" },
        { "Agents" = "reference/agents.md" },
