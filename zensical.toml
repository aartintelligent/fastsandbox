# Strict builds (`--strict`) fail on any of these. References to the API
# (`[Sandbox][fastsandbox.Sandbox]`) are resolved by mkdocstrings, which fails a
# strict build on its own when one does not resolve: Markdown references are
# left to it.
[project.validation]
invalid_links         = true
invalid_link_anchors  = true
unresolved_references = false
unresolved_footnotes  = true
unused_definitions    = true
unused_footnotes      = true

[project.theme]
# `overrides/home.html` is the template of the home page: its hero and the
# animated sandbox of `docs/assets/javascripts/home.js`.
custom_dir = "overrides"
language   = "en"
# No `navigation.indexes`: the first page of a section is an entry of its own
# (`Introduction`), so that the sidebar lists every page by name.
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/box"
repo = "fontawesome/brands/github"

# A single dark palette, without a toggle: the site is always dark, as the
# hero of the home page is.
[project.theme.palette]
scheme  = "slate"
primary = "indigo"
accent  = "indigo"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/aartintelligent/fastsandbox"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/fastsandbox/"

[project.markdown_extensions]
abbr                                   = {}
admonition                             = {}
attr_list                              = {}
def_list                               = {}
footnotes                              = {}
md_in_html                             = {}
toc.permalink                          = true
pymdownx.betterem                      = {}
pymdownx.details                       = {}
pymdownx.emoji.emoji_generator         = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index             = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums     = true
pymdownx.highlight.line_spans          = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite                  = {}
pymdownx.keys                          = {}
pymdownx.mark                          = {}
pymdownx.smartsymbols                  = {}
# `--8<-- "docs_src/tasks/run_tests.py"` includes a file of the repository,
# from its root; a missing one fails the build.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

# The API reference: `::: fastsandbox.Sandbox` renders the object from its
# docstring (Google style) and its annotations, the extension from
# `fastsandbox/_native.pyi`; nothing is imported, so the extension need not be
# built. The inventories link the types of Python and Pydantic.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://docs.pydantic.dev/latest/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style         = "google"
docstring_section_style = "table"
# Private names, and the configuration every Pydantic model shares, stay out.
filters                    = ["!^_", "!^model_config$"]
heading_level              = 2
members_order              = "source"
merge_init_into_class      = true
separate_signature         = true
show_root_heading          = true
show_root_full_path        = true
show_signature_annotations = true
show_source                = false
show_symbol_type_heading   = true
show_symbol_type_toc       = true
signature_crossrefs        = true
