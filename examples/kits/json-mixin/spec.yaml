# syntax=docker/sandbox-kit:3
{
  "schemaVersion": "3",
  "kind": "mixin",
  "displayName": "JSON mixin",
  "description": "Mixin of the fastsandbox examples, written in the JSON subset of YAML that the forge reads: writes a marker file at install time.",
  "version": "0.1.0",
  "capabilities": [
    {
      "type": "com.docker.sandbox/lifecycle@1",
      "config": {
        "install": [
          {
            "command": "echo 'json-mixin installed' > /home/agent/json-mixin.txt",
            "user": "agent",
            "description": "Writes the marker of the JSON mixin"
          }
        ]
      }
    }
  ]
}
