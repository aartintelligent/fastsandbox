# ------------------------------------------------------------------------------
# Docs — the documentation site, published to GitHub Pages.
#
# Every push to `main` builds the site of `docs/` with Zensical, in strict mode
# as the `Docs` job of ci.yml builds it, and deploys it to GitHub Pages:
# https://aartintelligent.github.io/fastsandbox/. Only the `docs` group of
# uv.lock is installed: the API reference is rendered from the docstrings and
# the stubs of the extension, which is not compiled.
#
# Pages publishes from GitHub Actions (Settings → Pages → Source), through the
# `github-pages` environment, which only `main` may deploy to. Run by hand
# (`workflow_dispatch`), the workflow deploys the current commit of `main`
# again. Every action is pinned to the commit of a release, as in ci.yml.
# ------------------------------------------------------------------------------

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: a newer push waits for the deployment in progress
# instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # uv must not rewrite `uv.lock`: a stale lockfile fails the job instead.
  UV_LOCKED: 1
  FORCE_COLOR: 1

jobs:
  # Builds the site into `site/` and uploads it as the artifact of Pages.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - run: uv run --only-group docs zensical build --clean --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Deploys the artifact to Pages; `id-token` lets the deployment prove that it
  # comes from this workflow.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
