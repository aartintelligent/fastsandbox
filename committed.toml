# ------------------------------------------------------------------------------
# committed — Conventional Commits enforcement, used by the `commits` CI job.
#
# Mirrors the rules stated in CONTRIBUTING.md and the changelog sections of
# release-please-config.json; change the three together. The same rules as
# `docker-sandbox`.
# ------------------------------------------------------------------------------

style = "conventional"

# The full type table from CONTRIBUTING.md, including `deprecate`, which
# release-please lists under its own changelog heading.
allowed_types = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "deprecate",
    "revert",
    "test",
    "build",
    "ci",
    "chore",
    "style",
]

# Header and wrapped lines are capped at 100 columns.
subject_length = 100
line_length    = 100

# Conventional Commits descriptions are lowercase by convention.
subject_capitalized = false

# Dependabot writes its own commit bodies, which are not wrapped, and never
# rewords them, so its commits are exempt; release-please's release commits
# are its own too. The pull request title still has to be a Conventional
# Commit, since it becomes the squash commit on `main`.
ignore_author_re = "^(dependabot|release-please)\\[bot\\]"
