# ------------------------------------------------------------------------------
# pyproject — my-agents: coding agents at work in throw-away sandboxes of
# Docker Sandboxes, with fastsandbox.
#
# `fastsandbox run fix --repo . --issue "..."` runs the agent task of
# `agents.py` (`[tool.fastsandbox] app`); `uv run pytest` runs the tests, which
# need no daemon.
# ------------------------------------------------------------------------------

[project]
name            = "my-agents"
version         = "0.1.0"
description     = "Coding agents at work in throw-away sandboxes"
requires-python = ">=3.14"
dependencies    = ["fastsandbox>=0.1"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.5"]

[tool.fastsandbox]
app = "agents.py"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode                       = "auto"
pythonpath                         = ["."]
testpaths                          = ["tests"]
