# ------------------------------------------------------------------------------
# Codecov — how the coverage of fastsandbox is reported.
#
# The `coverage` job of ci.yml uploads the line coverage of the package that
# `pytest --cov` measures, and fails on its own below the share that
# `[tool.coverage.report] fail_under` sets in pyproject.toml: Codecov is the
# view of it — uncovered lines annotated on the pull request diff, a summary
# comment, the history of `main`. Its statuses hold the same bar, for the
# whole package and for the lines a pull request changes; raise the three
# together as the tests grow.
#
# Pull requests that leave the package untouched upload nothing, so these
# statuses must not be required by branch protection: `CI OK` is.
# ------------------------------------------------------------------------------

# The branch Codecov compares pull requests with and shows the history of:
# `main`, which Codecov does not take from GitHub on its own.
codecov:
  branch: main

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 85%
    patch:
      default:
        target: 85%

comment:
  layout: "condensed_header, diff, files"
